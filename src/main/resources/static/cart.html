<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store | Shopping Cart</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

<!-- Navbar -->
<nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <a href="index.html" class="flex items-center gap-2 text-2xl font-extrabold text-indigo-600">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>E-Shop</span>
            </a>
            <div class="flex items-center gap-6 font-medium text-gray-600">
                <a href="index.html" class="hover:text-indigo-600 transition"><i class="fa-solid fa-house mr-1"></i> Home</a>
                <a href="products.html" class="hover:text-indigo-600 transition"><i class="fa-solid fa-box-open mr-1"></i> Products</a>
                <a href="cart.html" class="text-indigo-600 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-cart-shopping"></i> Cart
                </a>
                <a href="orders.html" class="hover:text-indigo-600 transition"><i class="fa-solid fa-receipt mr-1"></i> Orders</a>
                <button onclick="logout()" class="text-red-500 hover:text-red-700 transition"><i class="fa-solid fa-right-from-bracket mr-1"></i> Logout</button>
            </div>
        </div>
    </div>
</nav>

<!-- Main Container -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">

    <h1 class="text-3xl font-extrabold text-gray-900 mb-8 flex items-center gap-3">
        <i class="fa-solid fa-cart-shopping text-indigo-600"></i> Your Shopping Cart
    </h1>

    <!-- Cart Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Items List Container (Left Side 2-Columns) -->
        <div class="lg:col-span-2 space-y-4" id="cartItemsContainer">
            <div class="bg-white rounded-2xl p-8 text-center text-gray-400 shadow-sm border border-slate-200">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
                <p>Loading your cart items...</p>
            </div>
        </div>

        <!-- Order Summary Card (Right Side 1-Column) -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 h-fit space-y-6">
            <h2 class="text-xl font-bold text-gray-900 border-b border-slate-100 pb-4">Order Summary</h2>

            <div class="space-y-3 text-sm text-gray-600">
                <div class="flex justify-between">
                    <span>Subtotal</span>
                    <span class="font-semibold text-gray-900" id="subtotal">₹0</span>
                </div>
                <div class="flex justify-between">
                    <span>Estimated Shipping</span>
                    <span class="font-semibold text-emerald-600">FREE</span>
                </div>
                <div class="flex justify-between">
                    <span>Tax (GST)</span>
                    <span class="font-semibold text-gray-900" id="tax">₹0</span>
                </div>
                <div class="border-t border-slate-100 pt-3 flex justify-between text-lg font-extrabold text-gray-900">
                    <span>Total Amount</span>
                    <span class="text-indigo-600" id="totalAmount">₹0</span>
                </div>
            </div>

            <button onclick="goToCheckout()" id="checkoutBtn" disabled
                    class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                <span>Proceed to Checkout</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

    </div>

</main>

<!-- Footer -->
<footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm border-t border-gray-800">
    <p>© 2026 E-Shop Store. All Rights Reserved.</p>
</footer>

<!-- Backend Integration Script -->
<script>
    let currentCart = null;

    async function fetchCart() {
        const token = localStorage.getItem('token');
        if(!token) {
            alert("Please login first!");
            window.location.href = 'login.html';
            return;
        }

        try {
            const response = await fetch('http://localhost:8080/api/cart', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if(response.ok) {
                currentCart = await response.json();
                renderCart(currentCart);
            } else {
                document.getElementById('cartItemsContainer').innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center text-red-500 border border-slate-200">
                        Failed to fetch cart.
                    </div>`;
            }
        } catch(e) {
            document.getElementById('cartItemsContainer').innerHTML = `
                <div class="bg-white rounded-2xl p-8 text-center text-red-500 border border-slate-200">
                    Server error connection failed.
                </div>`;
        }
    }

    function renderCart(cart) {
        const container = document.getElementById('cartItemsContainer');
        const items = cart.items || cart.cartItems || [];

        if(items.length === 0) {
            container.innerHTML = `
                <div class="bg-white rounded-2xl p-12 text-center shadow-sm border border-slate-200 space-y-4">
                    <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto text-3xl">
                        <i class="fa-solid fa-cart-flatbed"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800">Your cart is empty</h3>
                    <p class="text-gray-500 text-sm">Looks like you haven't added anything to your cart yet.</p>
                    <a href="products.html" class="inline-block bg-indigo-600 text-white font-semibold px-6 py-2.5 rounded-xl hover:bg-indigo-700 transition">
                        Explore Products
                    </a>
                </div>`;

            document.getElementById('subtotal').innerText = '₹0';
            document.getElementById('tax').innerText = '₹0';
            document.getElementById('totalAmount').innerText = '₹0';
            document.getElementById('checkoutBtn').disabled = true;
            return;
        }

        let subtotal = 0;

        container.innerHTML = items.map(item => {
            const itemTotal = (item.product.price || 0) * item.quantity;
            subtotal += itemTotal;

            return `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">

                    <div class="flex items-center gap-4 w-full sm:w-auto">
                        <div class="w-20 h-20 bg-slate-100 rounded-xl overflow-hidden flex-shrink-0 flex items-center justify-center p-2">
                            <img src="${item.product.imageUrl || 'https://via.placeholder.com/100'}" alt="${item.product.name}" class="max-h-full max-w-full object-contain">
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900 text-lg">${item.product.name}</h3>
                            <p class="text-indigo-600 font-bold text-sm">₹${item.product.price} <span class="text-gray-400 font-normal">each</span></p>
                        </div>
                    </div>

                    <div class="flex items-center justify-between w-full sm:w-auto gap-6">
                        <div class="flex items-center bg-slate-100 rounded-xl px-3 py-1.5 font-bold text-gray-700">
                            <span>Qty: ${item.quantity}</span>
                        </div>

                        <div class="text-right">
                            <span class="text-xs text-gray-400 block font-medium">Subtotal</span>
                            <span class="text-lg font-extrabold text-gray-900">₹${itemTotal}</span>
                        </div>

                        <button onclick="removeItem(${item.product.id})" class="text-slate-400 hover:text-red-500 transition p-2 text-lg">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>

                </div>
            `;
        }).join('');

        const tax = Math.round(subtotal * 0.18); // 18% GST calculation
        const total = subtotal + tax;

        document.getElementById('subtotal').innerText = `₹${subtotal}`;
        document.getElementById('tax').innerText = `₹${tax}`;
        document.getElementById('totalAmount').innerText = `₹${total}`;
        document.getElementById('checkoutBtn').disabled = false;
    }

    async function removeItem(productId) {
        const token = localStorage.getItem('token');
        try {
            const response = await fetch(`http://localhost:8080/api/cart/remove?productId=${productId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if(response.ok) {
                fetchCart();
            } else {
                alert("Could not remove item.");
            }
        } catch(e) {
            alert("Server error.");
        }
    }

    function goToCheckout() {
        window.location.href = 'checkout.html';
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }

    // Initialize
    fetchCart();
</script>
</body>
</html>
