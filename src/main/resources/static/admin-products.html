<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Products</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h2>Admin Panel</h2>

    <div>
        <a href="dashboard.html">Dashboard</a>
        <a href="products.html">Products</a>
        <a href="admin-orders.html">Orders</a>
    </div>
</nav>

<div class="admin-container">

    <h1>Manage Products</h1>

    <form id="productForm">

        <input id="name" placeholder="Product Name" required>

        <input id="description" placeholder="Description" required>

        <input id="price" type="number" placeholder="Price" required>

        <input id="quantity" type="number" placeholder="Quantity" required>

        <input id="category" placeholder="Category" required>

        <button type="submit">Add Product</button>

    </form>

    <h2>Products</h2>

    <div id="productList"></div>

</div>

<script>

    async function loadProducts() {

        const response = await fetch("/api/products");

        const products = await response.json();

        const container = document.getElementById("productList");

        container.innerHTML = "";

        products.forEach(product => {

            const div = document.createElement("div");

            div.className = "admin-card";

            div.innerHTML = `
                <h3>${product.name}</h3>

                <p>${product.description}</p>

                <p>Price: ₹${product.price}</p>

                <p>Quantity: ${product.quantity}</p>

                <p>Category: ${product.category}</p>

                <button onclick="deleteProduct(${product.id})">
                    Delete
                </button>
            `;

            container.appendChild(div);
        });
    }

    document.getElementById("productForm").addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const product = {

                name: document.getElementById("name").value,

                description:
                    document.getElementById("description").value,

                price:
                    Number(document.getElementById("price").value),

                quantity:
                    Number(document.getElementById("quantity").value),

                category:
                    document.getElementById("category").value
            };

            const response = await fetch("/api/products/admin", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(product)
            });

            if (response.ok) {

                alert("Product added successfully!");

                document.getElementById("productForm").reset();

                loadProducts();

            } else {

                alert("Failed to add product");
            }
        }
    );

    async function deleteProduct(id) {

        const response =
            await fetch(`/api/products/${id}`, {
                method: "DELETE"
            });

        if (response.ok) {

            alert("Product deleted!");

            loadProducts();
        }
    }

    loadProducts();

</script>

</body>
</html>
