<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store | My Orders</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

<!-- Navbar -->
<nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <a href="index.html" class="flex items-center gap-2 text-2xl font-extrabold text-indigo-600">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>E-Shop</span>
            </a>
            <div class="flex items-center gap-6 font-medium text-gray-600">
                <a href="index.html" class="hover:text-indigo-600 transition"><i class="fa-solid fa-house mr-1"></i> Home</a>
                <a href="products.html" class="hover:text-indigo-600 transition"><i class="fa-solid fa-box-open mr-1"></i> Products</a>
                <a href="cart.html" class="hover:text-indigo-600 transition flex items-center gap-1">
                    <i class="fa-solid fa-cart-shopping"></i> Cart
                </a>
                <a href="orders.html" class="text-indigo-600 font-semibold"><i class="fa-solid fa-receipt mr-1"></i> Orders</a>
                <button onclick="logout()" class="text-red-500 hover:text-red-700 transition"><i class="fa-solid fa-right-from-bracket mr-1"></i> Logout</button>
            </div>
        </div>
    </div>
</nav>

<!-- Main Container -->
<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">

    <h1 class="text-3xl font-extrabold text-gray-900 mb-8 flex items-center gap-3">
        <i class="fa-solid fa-box-archive text-indigo-600"></i> My Order History
    </h1>

    <!-- Orders Container List -->
    <div id="ordersContainer" class="space-y-6">
        <div class="bg-white rounded-2xl p-12 text-center text-gray-400 shadow-sm border border-slate-200">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
            <p>Loading your order history...</p>
        </div>
    </div>

</main>

<!-- Footer -->
<footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm border-t border-gray-800">
    <p>© 2026 E-Shop Store. All Rights Reserved.</p>
</footer>

<!-- Backend Integration Script -->
<script>
    async function fetchOrders() {
        const token = localStorage.getItem('token');
        if(!token) {
            alert("Please login first!");
            window.location.href = 'login.html';
            return;
        }

        try {
            const response = await fetch('http://localhost:8080/api/orders/user', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if(response.ok) {
                const orders = await response.json();
                renderOrders(orders);
            } else {
                document.getElementById('ordersContainer').innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center text-red-500 border border-slate-200 font-medium">
                        Failed to fetch orders from server.
                    </div>`;
            }
        } catch(e) {
            document.getElementById('ordersContainer').innerHTML = `
                <div class="bg-white rounded-2xl p-8 text-center text-red-500 border border-slate-200 font-medium">
                    Unable to connect to backend server.
                </div>`;
        }
    }

    function renderOrders(orders) {
        const container = document.getElementById('ordersContainer');

        if(!orders || orders.length === 0) {
            container.innerHTML = `
                <div class="bg-white rounded-2xl p-12 text-center shadow-sm border border-slate-200 space-y-4">
                    <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto text-3xl">
                        <i class="fa-solid fa-receipt"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800">No orders placed yet</h3>
                    <p class="text-gray-500 text-sm">When you place orders, they will appear right here.</p>
                    <a href="products.html" class="inline-block bg-indigo-600 text-white font-semibold px-6 py-2.5 rounded-xl hover:bg-indigo-700 transition">
                        Start Shopping
                    </a>
                </div>`;
            return;
        }

        container.innerHTML = orders.map(order => {
            const items = order.items || order.orderItems || [];
            const orderDate = order.orderDate ? new Date(order.orderDate).toLocaleDateString('en-IN', {
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            }) : 'N/A';

            const statusColor = order.status === 'DELIVERED'
                ? 'bg-emerald-100 text-emerald-800 border-emerald-200'
                : 'bg-blue-100 text-blue-800 border-blue-200';

            return `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

                    <!-- Header -->
                    <div class="bg-slate-50 p-4 sm:p-6 border-b border-slate-200 flex flex-wrap items-center justify-between gap-4 text-sm">
                        <div class="space-y-1">
                            <span class="text-xs text-gray-400 block font-medium">Order Reference</span>
                            <span class="font-extrabold text-gray-900">#ORD-${order.id}</span>
                        </div>

                        <div class="space-y-1">
                            <span class="text-xs text-gray-400 block font-medium">Date Placed</span>
                            <span class="font-semibold text-gray-700">${orderDate}</span>
                        </div>

                        <div class="space-y-1">
                            <span class="text-xs text-gray-400 block font-medium">Total Amount</span>
                            <span class="font-extrabold text-indigo-600">₹${order.totalAmount}</span>
                        </div>

                        <div>
                            <span class="px-3 py-1 text-xs font-bold rounded-full border ${statusColor}">
                                <i class="fa-solid fa-circle text-[8px] mr-1 align-middle"></i>
                                ${order.status || 'PLACED'}
                            </span>
                        </div>
                    </div>

                    <!-- Body (Items List) -->
                    <div class="p-4 sm:p-6 space-y-4">
                        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Ordered Items</p>

                        <div class="divide-y divide-slate-100">
                            ${items.map(item => `
                                <div class="py-3 flex items-center justify-between text-sm">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center text-indigo-600 font-bold text-xs">
                                            <i class="fa-solid fa-box"></i>
                                        </div>
                                        <div>
                                            <p class="font-bold text-gray-800">${item.product ? item.product.name : 'Product Item'}</p>
                                            <p class="text-xs text-gray-400">Qty: ${item.quantity}</p>
                                        </div>
                                    </div>
                                    <span class="font-semibold text-gray-900">₹${(item.price || item.product?.price || 0) * item.quantity}</span>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Address Info -->
                        <div class="pt-3 border-t border-slate-100 text-xs text-gray-500 flex items-center gap-2">
                            <i class="fa-solid fa-location-dot text-indigo-500"></i>
                            <span><strong>Delivery Address:</strong> ${order.shippingAddress || 'Address details on file'}</span>
                        </div>
                    </div>

                </div>
            `;
        }).join('');
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }

    // Initialize
    fetchOrders();
</script>
</body>
</html>
